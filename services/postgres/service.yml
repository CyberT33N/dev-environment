version: '3.8'

services:
  postgres:
    # Pinned to 17 because 18+ changed the data directory layout (mount must be
    # /var/lib/postgresql, not /var/lib/postgresql/data). Bumping to 18 requires
    # a pg_upgrade of existing POSTGRES_HOME data.
    image: postgres:17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_HOME:-/srv/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 10s
      timeout: 5s
      retries: 5 